<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0718"/>
      <stop offset="1" stop-color="#1a0d33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".38" r=".5">
      <stop offset="0" stop-color="#9b6cf0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9b6cf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- weekly check-in grid: 7 days x 4 habits -->
  <g transform="translate(860 170)">
    <g fill="#9b6cf0">
      <rect x="0" y="0" width="70" height="70" rx="14"/><rect x="90" y="0" width="70" height="70" rx="14"/><rect x="180" y="0" width="70" height="70" rx="14" fill-opacity=".18"/><rect x="270" y="0" width="70" height="70" rx="14"/><rect x="360" y="0" width="70" height="70" rx="14"/><rect x="450" y="0" width="70" height="70" rx="14" fill-opacity=".18"/><rect x="540" y="0" width="70" height="70" rx="14"/>
    </g>
    <g fill="#3ed8ee">
      <rect x="0" y="90" width="70" height="70" rx="14" fill-opacity=".18"/><rect x="90" y="90" width="70" height="70" rx="14"/><rect x="180" y="90" width="70" height="70" rx="14"/><rect x="270" y="90" width="70" height="70" rx="14"/><rect x="360" y="90" width="70" height="70" rx="14" fill-opacity=".18"/><rect x="450" y="90" width="70" height="70" rx="14"/><rect x="540" y="90" width="70" height="70" rx="14"/>
    </g>
    <g fill="#c86cf0">
      <rect x="0" y="180" width="70" height="70" rx="14"/><rect x="90" y="180" width="70" height="70" rx="14" fill-opacity=".18"/><rect x="180" y="180" width="70" height="70" rx="14" fill-opacity=".18"/><rect x="270" y="180" width="70" height="70" rx="14"/><rect x="360" y="180" width="70" height="70" rx="14"/><rect x="450" y="180" width="70" height="70" rx="14"/><rect x="540" y="180" width="70" height="70" rx="14" fill-opacity=".18"/>
    </g>
    <g fill="#9b6cf0">
      <rect x="0" y="270" width="70" height="70" rx="14"/><rect x="90" y="270" width="70" height="70" rx="14"/><rect x="180" y="270" width="70" height="70" rx="14"/><rect x="270" y="270" width="70" height="70" rx="14" fill-opacity=".18"/><rect x="360" y="270" width="70" height="70" rx="14"/><rect x="450" y="270" width="70" height="70" rx="14"/><rect x="540" y="270" width="70" height="70" rx="14"/>
    </g>
